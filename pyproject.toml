[project]
name = "blaulichtsms-einsatzmonitor-tv-controller"
version = "0.1.0"
description = "Switches a TV on via HDMI CEC while a blaulichtSMS alarm is active"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
# python-cec by trainman419, only required for cec_mode = 2
# needs libcec-dev build-essential python3-dev to build
cec = ["cec>=0.2.7"]

[dependency-groups]
dev = [
    "flask>=3.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
